[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devagent"
version = "0.1.1"
description = "AI development agent for specification-to-code implementation"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "DevAgent Authors", email = "hello@devagent.dev" }
]
keywords = ["cli", "mcp", "llm", "analysis", "requirements", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "platformdirs>=4.2.0",
    "tomli-w>=1.0.0",
    "mcp[cli]>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-groq>=0.1.9",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "sentence-transformers>=3.1.0",
    "chromadb>=0.5.0",
    "pathspec>=0.12.0",
    "radon>=6.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "pydantic>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/SpecSync"
Repository = "https://github.com/yourusername/SpecSync.git"
Issues = "https://github.com/yourusername/SpecSync/issues"

[project.scripts]
devagent = "devagent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["devagent"]
