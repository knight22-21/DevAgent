name: Benchmark Canary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  canary:
    name: Canary benchmark (no LLM)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install DevAgent
        run: pip install -e ".[dev]"

      - name: Run canary benchmark
        run: python -m pytest tests/ -q --tb=short && devagent bench canary --skip-legacy

      - name: Upload canary results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-results
          path: benchmarks/results/
          if-no-files-found: ignore
