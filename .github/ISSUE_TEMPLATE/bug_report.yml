name: Bug Report
description: Something is broken or behaving unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "devagent run crashes with..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "I expected it to..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Run `devagent run`
        2. Type "..."
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Paste any error output here. Run with `--verbose` for full tracebacks.
      render: text

  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options:
        - ollama (local)
        - anthropic
        - openai
        - groq
        - gemini
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DevAgent version
      description: Output of `devagent --version`
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
